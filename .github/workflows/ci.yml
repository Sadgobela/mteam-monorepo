name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mteam
          POSTGRES_PASSWORD: mteam
          POSTGRES_DB: mteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mteam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mteam:mteam@localhost:5432/mteam
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mteam/db db:deploy
      - run: pnpm --filter @mteam/db db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # End-to-end tests in a real browser against the built app. Separate from "check" so a slow browser run never holds up
  # the fast checks, and so its database (mteam_e2e) is a fresh one of its own.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mteam
          POSTGRES_PASSWORD: mteam
          POSTGRES_DB: mteam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mteam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mteam:mteam@localhost:5432/mteam_e2e
      E2E_DATABASE_URL: postgresql://mteam:mteam@localhost:5432/mteam_e2e
    steps:
      - uses: actions/checkout@v4
      # SeaweedFS needs its config file mounted, which a service container cannot do, so it runs from docker-compose.yml.
      - name: Start photo storage
        run: |
          docker compose up -d storage
          docker compose up storage-init
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright's browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mteam/e2e exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mteam/e2e exec playwright install-deps chromium
      - run: pnpm --filter @mteam/db db:deploy
      - run: pnpm --filter @mteam/db db:seed
      - run: pnpm build
      - run: pnpm --filter @mteam/e2e e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
